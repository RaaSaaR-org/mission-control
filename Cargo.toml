[package]
name = "mc"
version = "0.3.0"
authors = ["huhn511 <huhn.dev@gmail.com>"]
edition = "2021"
rust-version = "1.88"
description = "Git-based knowledge management CLI — manage customers, projects, meetings, research and tasks with Markdown + YAML frontmatter"
license = "MIT"
repository = "https://github.com/RaaSaaR-org/mission-control"
homepage = "https://github.com/RaaSaaR-org/mission-control"
documentation = "https://github.com/RaaSaaR-org/mission-control#readme"
readme = "README.md"
keywords = ["cli", "knowledge-management", "markdown", "crm", "project-management"]
categories = ["command-line-utilities"]
exclude = ["tests/", "data/"]

[[bin]]
name = "mc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
clap_complete = "4"
serde = { version = "1", features = ["derive"] }
# TODO: serde_yaml is deprecated; migrate to a maintained fork such as
# serde_yaml_ng or serde_norway (not serde_yml: archived and unsound,
# RUSTSEC-2025-0068). The migration is a mechanical rename of serde_yaml::.
serde_yaml = "0.9"
serde_json = "1"
colored = "2"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
zip = "2"
thiserror = "2"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "signal"] }
pulldown-cmark = "0.12"
unicode-width = "0.2"
genpdf = { version = "0.2", default-features = false }
rmcp = { version = "0.14", features = ["server", "transport-io"] }
schemars = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "cors", "request-id", "util", "timeout", "limit"] }
utoipa = { version = "5", features = ["axum_extras"] }
argon2 = "0.5"
password-hash = { version = "0.5", features = ["getrandom"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
fs2 = "0.4"

[dev-dependencies]
tempfile = "3"

# A few pedantic lints that catch real mistakes without much noise.
[lints.clippy]
implicit_clone = "warn"
