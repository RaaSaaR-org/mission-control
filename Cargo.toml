[package]
name = "mc"
version = "0.1.9"
authors = ["huhn511 <huhn.dev@gmail.com>"]
edition = "2021"
rust-version = "1.85"
description = "Git-based knowledge management CLI — manage customers, projects, meetings, research and tasks with Markdown + YAML frontmatter"
license = "MIT"
repository = "https://github.com/RaaSaaR-org/mission-control"
homepage = "https://github.com/RaaSaaR-org/mission-control"
documentation = "https://github.com/RaaSaaR-org/mission-control#readme"
readme = "README.md"
keywords = ["cli", "knowledge-management", "markdown", "crm", "project-management"]
categories = ["command-line-utilities"]
exclude = ["tests/", "data/"]

[[bin]]
name = "mc"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
# TODO: serde_yaml is deprecated; migrate to serde_yml once it reaches 1.0
# (currently v0.0.12 with docs.rs build failures — migration is a mechanical
# rename of serde_yaml:: → serde_yml:: across ~12 files).
serde_yaml = "0.9"
serde_json = "1"
colored = "2"
dialoguer = { version = "0.11", features = ["fuzzy-select"] }
walkdir = "2"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
zip = "2"
thiserror = "2"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net"] }
pulldown-cmark = "0.12"
genpdf = { version = "0.2", default-features = false }
rmcp = { version = "0.14", features = ["server", "transport-io"] }
schemars = "1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"
